<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Application Tracker</title>
    <!-- Font Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap" rel="stylesheet">

    <!-- Tailwind CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- Daisy Ui CSN -->
     <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- Font Awesome CDN -->
     <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />

    <style>
        *{
            font-family: "Geist", sans-serif;
            /* background-color: #eff5fb; */

        }
    </style>    

</head>
<body class="bg-[#eff5fb]">
    
    <header class="pt-20 w-[80%] mx-auto">
        <h1 class="text-[#002C5C] font-bold text-[32px]/[32px] mb-5 ">Job Application Tracker</h1>

        <div class="grid grid-cols-3 gap-4">
            <div class="p-5 bg-white rounded-lg">
                <h6 class="text-[14px] font-medium text-[#323B49]">Total</h6>
                <p class="text-[24px] font-bold text-[#002C5C]">0</p>
            </div>
            <div class="p-5 bg-white rounded-lg">
                <h6 class="text-[14px] font-medium text-[#323B49]">Interview</h6>
                <p class="text-[24px] font-bold text-[#10B981]">0</p>
            </div>
            <div class="p-5 bg-white rounded-lg">
                <h6 class="text-[14px] font-medium text-[#323B49]">Rejected</h6>
                <p class="text-[24px] font-bold text-[#EF4444]">0</p>
            </div>
        </div>
    </header>

    <hr class="w-[80%] mx-auto my-10">

    <main class="w-[80%] mx-auto ">
        <!--  -->
        <div class="my-10 flex justify-between">
            <div>
            <h3 class="text-[20px] font-semibold text-[#002C5C] mb-6">Available Jobs</h3>
            
            <!-- Button Section -->
            <div class="flex gap-2">
                <button class="btn text-[#64748B] px-4 py-2.5">All</button>
                <button class="btn text-[#64748B] px-4 py-2.5">Interview</button>
                <button class="btn text-[#64748B] px-4 py-2.5">Rejected</button>
            </div>
        </div>

        <div>
            <p class="text-[16px] font-medium text-[#64748B]">Jobs</p>
        </div>
        </div>

        <!-- Filtering Section -->
         <section>

         </section>

         <!-- Card section -->
          <section>
            <div class="flex justify-between rounded-lg bg-white p-6">
                <div class="space-y-4">
                   <div>
                        <h2 class="text-[18px]/[26px] font-semibold text-[#002C5C]">Mobile First Corp</h2>
                        <p class="text-base/5 text-[#64748B]">React Native Developer</p>
                   </div>
                    
                   
                    <p class="text-[14px] text-[#64748B]">Remote • Full-time • $130,000 - $175,000</p>
                    
                    
                    <div>
                        <p class="bg-blue-300 text-base/5 px-3 w-[20%] py-2 mb-2">Not Applied</p>
                        <p class="text-base/5 text-[#323B49]">Build cross-platform mobile applications using React Native. Work   on products used by millions of users worldwide.</p>
                    </div>
                        <div class="flex gap-2">
                            <button class="btn btn-outline btn-success">interview</button>
                            <button id="R-btn" class="btn btn-outline btn-error ">Rejected</button>
                        </div>
                </div>
                
                <div class="     ">
                    <img class="mt-5 border-2 rounded-full p-4 border-gray-200" src="./img/Delete.png" alt="">
                </div>
            </div>
          </section>

    </main>

    <script src="./script.js"></script>
</body>
</html>
